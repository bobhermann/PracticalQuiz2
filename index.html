<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practical Quiz 2</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #6fa8dc">

    <!-- Camera (WASD to move, drag mouse to look). Walk into the hut! -->
    <a-entity position="0 0 8">
      <a-camera position="0 1.6 0" wasd-controls="acceleration: 25"></a-camera>
    </a-entity>

    <!-- Lights -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#fff5e0" intensity="0.7" position="3 8 6"></a-light>

    <!-- Sky and ground -->
    <a-sky color="#6fa8dc"></a-sky>
    <a-plane rotation="-90 0 0" width="120" height="120" color="#0a7a0a"></a-plane>

    <!-- ================= ENVIRONMENT ================= -->
    <!-- Big curved green walls around the scene -->
    <a-cylinder position="0 3 0" radius="18" height="6" open-ended="true" theta-start="100" theta-length="160" segments-radial="64" color="#8fffb0" material="side: double"></a-cylinder>
    <a-cylinder position="0 3 0" radius="9" height="6" open-ended="true" theta-start="50" theta-length="40" segments-radial="32" color="#8fffb0" material="side: double"></a-cylinder>
    <a-cylinder position="0 3 0" radius="9" height="6" open-ended="true" theta-start="270" theta-length="40" segments-radial="32" color="#8fffb0" material="side: double"></a-cylinder>

    <!-- Hut platform and floor -->
    <a-cylinder position="0 0.05 0" radius="5.4" height="0.1" segments-radial="48" color="#cfc6b4"></a-cylinder>
    <a-cylinder position="0 0.1 0" radius="4.6" height="0.2" segments-radial="48" color="#3f7a58"></a-cylinder>

    <!-- Steps and path to the hut door -->
    <a-box position="0 0.075 5.0" width="1.6" height="0.15" depth="0.6" color="#d9c7c0"></a-box>
    <a-box position="0 0.05 5.6" width="1.6" height="0.1" depth="0.6" color="#c4b0a8"></a-box>
    <a-box position="0 0.02 6.3" width="1.4" height="0.04" depth="0.7" color="#d9c7c0"></a-box>
    <a-box position="0 0.02 7.0" width="1.4" height="0.04" depth="0.7" color="#c4b0a8"></a-box>
    <a-box position="0 0.02 7.7" width="1.4" height="0.04" depth="0.7" color="#d9c7c0"></a-box>
    <a-box position="0 0.02 8.4" width="1.4" height="0.04" depth="0.7" color="#c4b0a8"></a-box>
    <a-box position="0 0.02 9.1" width="1.4" height="0.04" depth="0.7" color="#d9c7c0"></a-box>

    <!-- Hut: low wall with a doorway (gap at the front), posts, roof -->
    <a-cylinder position="0 0.8 0" radius="4.5" height="1.2" open-ended="true" theta-start="20" theta-length="320" segments-radial="48" color="#90ffb0" material="side: double"></a-cylinder>
    <a-cylinder position="0 1.2 0" radius="4.55" height="0.1" open-ended="true" theta-start="20" theta-length="320" segments-radial="48" color="#2e8b57" material="side: double"></a-cylinder>
    <a-cylinder position="2.25 2.0 3.90" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="3.90 2.0 2.25" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="4.50 2.0 0.00" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="3.90 2.0 -2.25" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="2.25 2.0 -3.90" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="0.00 2.0 -4.50" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="-2.25 2.0 -3.90" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="-3.90 2.0 -2.25" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="-4.50 2.0 -0.00" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="-3.90 2.0 2.25" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cylinder position="-2.25 2.0 3.90" radius="0.08" height="1.6" color="#d4ffe0"></a-cylinder>
    <a-cone position="0 3.9 0" radius-bottom="5.3" radius-top="0" height="2.2" segments-radial="48" color="#a6ffb8" material="side: double"></a-cone>
    <a-torus position="0 2.8 0" rotation="90 0 0" radius="5.2" radius-tubular="0.08" segments-tubular="64" color="#5fbf7f"></a-torus>

    <!-- ================= EVERYTHING BELOW IS INSIDE THE HUT ================= -->
    <a-entity id="inside-hut" position="0 0.2 0">

      <!-- Rug -->
      <a-cylinder position="0 0.01 0" radius="2.5" height="0.02" color="#a0522d"></a-cylinder>
      <a-cylinder position="0 0.02 0" radius="2.25" height="0.02" color="#d2a679"></a-cylinder>

      <!-- RECTANGULAR TABLE (2.8 long x 1.2 wide) -->
      <a-entity id="table">
        <a-box position="0 0.8 0" width="2.8" height="0.1" depth="1.2" color="#8b5a2b"></a-box>
        <a-box position="1.25 0.4 0.5" width="0.1" height="0.8" depth="0.1" color="#6b4423"></a-box>
        <a-box position="-1.25 0.4 0.5" width="0.1" height="0.8" depth="0.1" color="#6b4423"></a-box>
        <a-box position="1.25 0.4 -0.5" width="0.1" height="0.8" depth="0.1" color="#6b4423"></a-box>
        <a-box position="-1.25 0.4 -0.5" width="0.1" height="0.8" depth="0.1" color="#6b4423"></a-box>
      </a-entity>

      <!-- 4 CHAIRS (two on each long side) -->
      <a-entity position="-0.7 0 1.15" rotation="0 0 0">
        <a-box position="0 0.45 0" width="0.6" height="0.06" depth="0.6" color="#c68642"></a-box>
        <a-box position="0 0.8 0.27" width="0.6" height="0.7" depth="0.06" color="#c68642"></a-box>
        <a-cylinder position="0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
      </a-entity>
      <a-entity position="0.7 0 1.15" rotation="0 0 0">
        <a-box position="0 0.45 0" width="0.6" height="0.06" depth="0.6" color="#c68642"></a-box>
        <a-box position="0 0.8 0.27" width="0.6" height="0.7" depth="0.06" color="#c68642"></a-box>
        <a-cylinder position="0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
      </a-entity>
      <a-entity position="-0.7 0 -1.15" rotation="0 180 0">
        <a-box position="0 0.45 0" width="0.6" height="0.06" depth="0.6" color="#c68642"></a-box>
        <a-box position="0 0.8 0.27" width="0.6" height="0.7" depth="0.06" color="#c68642"></a-box>
        <a-cylinder position="0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
      </a-entity>
      <a-entity position="0.7 0 -1.15" rotation="0 180 0">
        <a-box position="0 0.45 0" width="0.6" height="0.06" depth="0.6" color="#c68642"></a-box>
        <a-box position="0 0.8 0.27" width="0.6" height="0.7" depth="0.06" color="#c68642"></a-box>
        <a-cylinder position="0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
        <a-cylinder position="-0.25 0.21 -0.25" radius="0.03" height="0.42" color="#5c3a1a"></a-cylinder>
      </a-entity>

      <!-- 4 TEA CUPS with tea and spoons -->
      <a-entity position="-0.7 0.85 0.4">
        <a-cylinder position="0 0.005 0" radius="0.1" height="0.01" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.06" height="0.1" color="#ffffff" open-ended="true" material="side: double"></a-cylinder>
        <a-circle position="0 0.095 0" rotation="-90 0 0" radius="0.055" color="#a0522d"></a-circle>
        <a-torus position="0.065 0.06 0" radius="0.03" radius-tubular="0.008" color="#ffffff"></a-torus>
        <!-- spoon -->
        <a-entity position="0.02 0.012 0" rotation="0 0 20">
          <a-cylinder position="0 0.08 0" radius="0.004" height="0.16" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
          <a-sphere position="0 0.005 0" radius="0.016" scale="1 0.3 1.5" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-sphere>
        </a-entity>
      </a-entity>
      <a-entity position="0.7 0.85 0.4">
        <a-cylinder position="0 0.005 0" radius="0.1" height="0.01" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.06" height="0.1" color="#ffffff" open-ended="true" material="side: double"></a-cylinder>
        <a-circle position="0 0.095 0" rotation="-90 0 0" radius="0.055" color="#a0522d"></a-circle>
        <a-torus position="0.065 0.06 0" radius="0.03" radius-tubular="0.008" color="#ffffff"></a-torus>
        <!-- spoon -->
        <a-entity position="0.02 0.012 0" rotation="0 0 20">
          <a-cylinder position="0 0.08 0" radius="0.004" height="0.16" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
          <a-sphere position="0 0.005 0" radius="0.016" scale="1 0.3 1.5" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-sphere>
        </a-entity>
      </a-entity>
      <a-entity position="-0.7 0.85 -0.4">
        <a-cylinder position="0 0.005 0" radius="0.1" height="0.01" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.06" height="0.1" color="#ffffff" open-ended="true" material="side: double"></a-cylinder>
        <a-circle position="0 0.095 0" rotation="-90 0 0" radius="0.055" color="#a0522d"></a-circle>
        <a-torus position="0.065 0.06 0" radius="0.03" radius-tubular="0.008" color="#ffffff"></a-torus>
        <!-- spoon -->
        <a-entity position="0.02 0.012 0" rotation="0 0 20">
          <a-cylinder position="0 0.08 0" radius="0.004" height="0.16" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
          <a-sphere position="0 0.005 0" radius="0.016" scale="1 0.3 1.5" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-sphere>
        </a-entity>
      </a-entity>
      <a-entity position="0.7 0.85 -0.4">
        <a-cylinder position="0 0.005 0" radius="0.1" height="0.01" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.06 0" radius="0.06" height="0.1" color="#ffffff" open-ended="true" material="side: double"></a-cylinder>
        <a-circle position="0 0.095 0" rotation="-90 0 0" radius="0.055" color="#a0522d"></a-circle>
        <a-torus position="0.065 0.06 0" radius="0.03" radius-tubular="0.008" color="#ffffff"></a-torus>
        <!-- spoon -->
        <a-entity position="0.02 0.012 0" rotation="0 0 20">
          <a-cylinder position="0 0.08 0" radius="0.004" height="0.16" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
          <a-sphere position="0 0.005 0" radius="0.016" scale="1 0.3 1.5" color="#c0c0c0" material="metalness: 0.8; roughness: 0.2"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 4 PLATES: 2 slices of bread + fried egg, beside each cup -->
      <a-entity position="-1.1 0.85 0.4" rotation="0 0 0">
        <a-cylinder position="0 0.006 0" radius="0.14" height="0.012" color="#ffffff"></a-cylinder>
        <a-torus position="0 0.014 0" rotation="90 0 0" radius="0.13" radius-tubular="0.006" color="#e8e8e8"></a-torus>
        <!-- two slices of bread -->
        <a-box position="-0.06 0.022 0" rotation="0 8 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <a-box position="0.06 0.022 0" rotation="0 -6 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <!-- fried egg -->
        <a-cylinder position="0 0.037 0" radius="0.06" height="0.012" scale="1.2 1 0.9" color="#fffdf5"></a-cylinder>
        <a-sphere position="0.01 0.05 0" radius="0.022" scale="1 0.7 1" color="#ffb400"></a-sphere>
      </a-entity>
      <a-entity position="1.1 0.85 0.4" rotation="0 0 0">
        <a-cylinder position="0 0.006 0" radius="0.14" height="0.012" color="#ffffff"></a-cylinder>
        <a-torus position="0 0.014 0" rotation="90 0 0" radius="0.13" radius-tubular="0.006" color="#e8e8e8"></a-torus>
        <!-- two slices of bread -->
        <a-box position="-0.06 0.022 0" rotation="0 8 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <a-box position="0.06 0.022 0" rotation="0 -6 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <!-- fried egg -->
        <a-cylinder position="0 0.037 0" radius="0.06" height="0.012" scale="1.2 1 0.9" color="#fffdf5"></a-cylinder>
        <a-sphere position="0.01 0.05 0" radius="0.022" scale="1 0.7 1" color="#ffb400"></a-sphere>
      </a-entity>
      <a-entity position="-1.1 0.85 -0.4" rotation="0 0 0">
        <a-cylinder position="0 0.006 0" radius="0.14" height="0.012" color="#ffffff"></a-cylinder>
        <a-torus position="0 0.014 0" rotation="90 0 0" radius="0.13" radius-tubular="0.006" color="#e8e8e8"></a-torus>
        <!-- two slices of bread -->
        <a-box position="-0.06 0.022 0" rotation="0 8 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <a-box position="0.06 0.022 0" rotation="0 -6 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <!-- fried egg -->
        <a-cylinder position="0 0.037 0" radius="0.06" height="0.012" scale="1.2 1 0.9" color="#fffdf5"></a-cylinder>
        <a-sphere position="0.01 0.05 0" radius="0.022" scale="1 0.7 1" color="#ffb400"></a-sphere>
      </a-entity>
      <a-entity position="1.1 0.85 -0.4" rotation="0 0 0">
        <a-cylinder position="0 0.006 0" radius="0.14" height="0.012" color="#ffffff"></a-cylinder>
        <a-torus position="0 0.014 0" rotation="90 0 0" radius="0.13" radius-tubular="0.006" color="#e8e8e8"></a-torus>
        <!-- two slices of bread -->
        <a-box position="-0.06 0.022 0" rotation="0 8 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <a-box position="0.06 0.022 0" rotation="0 -6 0" width="0.1" height="0.02" depth="0.11" color="#e0b46c"></a-box>
        <!-- fried egg -->
        <a-cylinder position="0 0.037 0" radius="0.06" height="0.012" scale="1.2 1 0.9" color="#fffdf5"></a-cylinder>
        <a-sphere position="0.01 0.05 0" radius="0.022" scale="1 0.7 1" color="#ffb400"></a-sphere>
      </a-entity>

      <!-- KETTLE (silver & black) -->
      <a-entity position="0.1 0.85 0">
        <a-cylinder position="0 0.015 0" radius="0.145" height="0.03" color="#111111"></a-cylinder>
        <a-cylinder position="0 0.13 0" radius="0.14" height="0.2" color="#c0c0c0" material="metalness: 0.9; roughness: 0.2"></a-cylinder>
        <a-cone position="0 0.27 0" radius-bottom="0.14" radius-top="0.05" height="0.08" color="#c0c0c0" material="metalness: 0.9; roughness: 0.2"></a-cone>
        <a-sphere position="0 0.32 0" radius="0.03" color="#111111"></a-sphere>
        <a-cylinder position="-0.19 0.2 0" rotation="0 0 45" radius="0.022" height="0.16" color="#c0c0c0" material="metalness: 0.9; roughness: 0.2"></a-cylinder>
        <a-cylinder position="-0.25 0.26 0" rotation="0 0 45" radius="0.024" height="0.03" color="#111111"></a-cylinder>
        <a-torus position="0.16 0.17 0" radius="0.08" radius-tubular="0.016" color="#111111"></a-torus>
      </a-entity>

      <!-- MILO TIN -->
      <a-entity position="-0.45 0.85 0">
        <a-cylinder position="0 0.15 0" radius="0.12" height="0.3" color="#1e7d32"></a-cylinder>
        <a-cylinder position="0 0.15 0" radius="0.123" height="0.1" color="#ffffff"></a-cylinder>
        <a-cylinder position="0 0.31 0" radius="0.125" height="0.03" color="#0d4d1a"></a-cylinder>
        <a-text value="MiLo" position="0 0.15 0.125" align="center" width="0.9" color="#1e7d32"></a-text>
      </a-entity>

      <!-- MILK TIN -->
      <a-entity position="0.55 0.85 0">
        <a-cylinder position="0 0.11 0" radius="0.09" height="0.22" color="#f5f5f5"></a-cylinder>
        <a-cylinder position="0 0.11 0" radius="0.092" height="0.08" color="#1e5bb8"></a-cylinder>
        <a-cylinder position="0 0.23 0" radius="0.094" height="0.025" color="#c0c0c0"></a-cylinder>
        <a-text value="MILK" position="0 0.11 0.094" align="center" width="0.6" color="#ffffff"></a-text>
      </a-entity>

      <!-- GLASS JAR WITH WATER -->
      <a-entity position="1.0 0.85 0">
        <a-cylinder position="0 0.09 0" radius="0.092" height="0.18" color="#2f9bff" material="opacity: 0.85; transparent: true"></a-cylinder>
        <a-circle position="0 0.181 0" rotation="-90 0 0" radius="0.092" color="#8fd0ff"></a-circle>
        <a-cylinder position="0 0.13 0" radius="0.1" height="0.26" open-ended="true" color="#e6f6ff" material="opacity: 0.25; transparent: true; side: double; depthWrite: false"></a-cylinder>
        <a-cylinder position="0 0.005 0" radius="0.1" height="0.01" color="#cfe9f7" material="opacity: 0.6; transparent: true"></a-cylinder>
        <a-cylinder position="0 0.27 0" radius="0.103" height="0.025" color="#999999"></a-cylinder>
      </a-entity>

      <!-- Flower vase -->
      <a-entity position="-1.0 0.85 0">
        <a-cylinder position="0 0.06 0" radius="0.04" height="0.12" color="#4682b4"></a-cylinder>
        <a-cylinder position="0 0.2 0" radius="0.004" height="0.16" color="#228b22"></a-cylinder>
        <a-sphere position="0 0.3 0" radius="0.04" color="#ff4d6d"></a-sphere>
      </a-entity>

    </a-entity>
  </a-scene>
</body>
</html>
